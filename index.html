<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a1020" />
    <title>hookies</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; }
      body {
        background: #0a1020;
        color: #dfe6ef;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        touch-action: none;
      }
      #lienzo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

      .panel {
        position: fixed;
        left: max(1rem, env(safe-area-inset-left));
        top: max(1rem, env(safe-area-inset-top));
        padding: 0.85rem 1rem;
        background: rgba(10, 16, 32, 0.68);
        border: 1px solid rgba(150, 180, 220, 0.18);
        border-radius: 3px;
        backdrop-filter: blur(8px);
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      body.listo .panel { opacity: 1; }

      h1 {
        margin: 0 0 0.6rem;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #8fa8c4;
      }
      dl { display: grid; grid-template-columns: auto auto; gap: 0.25rem 1.2rem; margin: 0; }
      dt { color: #7e93ad; }
      dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

      .pie {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: max(1rem, env(safe-area-inset-bottom));
        color: #6b7e96;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        opacity: 0;
        transition: opacity 0.6s ease 0.3s;
      }
      body.listo .pie { opacity: 1; }
    </style>
  </head>
  <body>
    <canvas id="lienzo"></canvas>

    <div class="panel">
      <h1>hookies</h1>
      <dl>
        <dt>semilla</dt><dd id="semilla">—</dd>
        <dt>tiempo</dt><dd id="tiempo">—</dd>
        <dt>tierra</dt><dd id="tierra">—</dd>
        <dt>temperatura</dt><dd id="temperatura">—</dd>
        <dt>bajo cero</dt><dd id="hielo">—</dd>
        <dt>ríos</dt><dd id="rios">—</dd>
        <dt>vegetación</dt><dd id="bosque">—</dd>
      </dl>
    </div>

    <p class="pie">arrastra para girar · rueda o pellizco para acercarte</p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
