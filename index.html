<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>hookies</title>
    <style>
      :root {
        color-scheme: dark;
        --fondo: #0d0f12;
        --tinta: #e6e3dc;
        --tenue: #7c8391;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--fondo);
        color: var(--tinta);
        font: 15px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
      }
      main { width: min(38rem, 100%); }
      h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 0.25rem; }
      p.sub { color: var(--tenue); margin: 0 0 2rem; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 0.4rem 1.5rem; margin: 0; }
      dt { color: var(--tenue); }
      dd { margin: 0; font-variant-numeric: tabular-nums; }
      footer { margin-top: 2rem; color: var(--tenue); font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>hookies</h1>
      <p class="sub">Fase 0 — esqueleto. Todavía no hay mundo que mirar.</p>
      <dl>
        <dt>semilla</dt><dd id="semilla">—</dd>
        <dt>tick</dt><dd id="tick">—</dd>
        <dt>materia</dt><dd id="materia">—</dd>
        <dt>worker</dt><dd id="worker">arrancando…</dd>
      </dl>
      <footer>La simulación corre en un Web Worker. Esta página solo mira.</footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
